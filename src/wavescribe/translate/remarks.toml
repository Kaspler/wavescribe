# What a translation model writes when it talks about the text instead of translating it: "the
# text is unclear due to recognition errors", "a coherent translation cannot be provided".
#
# Read by translate/checks.py.
# - `phrases`: a reply that says one of these is not kept as a translation; the line is stored
#   and shown with its original words alone.
# - `notes`: words that make a note of a bracketed part ("[missing word]", "(unclear)"). A
#   bracketed part that says one of these, or one of the phrases, is cut out of the reply and
#   the rest is kept. Outside brackets they mean nothing: a programme may well say "unclear".
#   "[sic]" is not listed: in brackets it can as well be a name.
#
# Every entry applies to every reply, whatever language was asked for: a model that comments
# does it in the target language, in the station's, or in English. The sections only keep the
# file readable. The languages listed here are the only ones in which a remark is recognised
# by its wording; in any other language only its shape can give it away (see checks.py).
#
# Keep the phrases about recognising, transcribing and translating the text itself, which a
# translator says and a broadcaster hardly ever does. A phrase a programme could say ("the
# original text", "it makes no sense") stays out: a remark shown as a translation costs one
# odd line, a list that is too wide costs real translations. A line whose own words say one of
# these in the station's language keeps its translation: the programme is about the subject.
#
# Matching ignores case, accents and other marks, and punctuation, and takes whole words.

[de]
phrases = ["Erkennungsfehler", "Erkennungsfehlern", "Spracherkennungsfehler",
           "Transkriptionsfehler", "Transkriptionsfehlern", "falsch erkannt",
           "nicht übersetzbar", "kann nicht übersetzt werden", "lässt sich nicht übersetzen",
           "nicht sinnvoll übersetzen", "sinnvolle Übersetzung", "kohärente Übersetzung",
           "Übersetzung ist nicht möglich", "keine Übersetzung möglich", "Ausgangstext",
           "Quelltext", "der Text ist unverständlich", "der Text ist unklar",
           "hier ist die Übersetzung", "Anmerkung des Übersetzers"]
notes = ["unverständlich", "nicht verständlich", "unklar", "fehlendes Wort",
         "unbekanntes Wort", "unbekannter Name", "Anmerkung", "Anm"]

