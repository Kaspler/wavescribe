# Band plans: what is where on the dial, written for Wavescribe from public allocation facts
# (ITU Radio Regulations, CEPT/ECC decisions, IARU region band plans, national rules). No text
# or tables are copied from those documents; frequencies and channel rasters are facts.
#
# Frequencies are in MHz. `mode` is how voice is demodulated (wfm, nfm, am); `step_khz` the
# channel raster; `channel_khz` the channel width when it differs from the raster.
# `privacy` decides what Wavescribe does with what it hears (docs/RADIO.md):
#   broadcast  meant for the public: transcribed, stored and exported like a stream
#   amateur    open by design: transcribed; text kept briefly, no audio, not exported
#   utility    airband, marine: opt-in; text kept briefly, no audio, not exported
#   private    licence-free personal radio and anything unlisted: opt-in with an
#              acknowledgement; live text only, nothing stored or exported
#   digital    digital or encrypted services: opt-in with an acknowledgement; Wavescribe has
#              no digital decoder and never decrypts, so tuning one gives noise
# These are the defaults; the user can change what is kept per class ([radio.policy.<class>]).
# `regions` are ITU regions ("1" Europe, Africa, the Middle East; "2" the Americas; "3" Asia
# and Oceania), or "cept" for the CEPT countries' harmonised bands.

[[band]]
id = "fm"
name = "FM broadcast"
start = 87.5
stop = 108.0
mode = "wfm"
step_khz = 100
privacy = "broadcast"
regions = ["1", "3"]

