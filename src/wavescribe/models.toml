# Model registry: every model Wavescribe lists. Rules: docs/LICENSING.md ("Model registry rules").
# Each entry pins an exact revision (Hugging Face commit SHA) or a sha256 for direct downloads.
# Conversions inherit the upstream licence; `upstream` names the rights holder's original.
# Bring-your-own models go in the private config/models.local.toml instead.
#
# `languages` holds BCP-47 tags. A bare language ("pt") matches every region ("pt-PT", "pt-BR");
# "*" means the model is language-independent or covers too many languages to list here.

[chains]
# Default order per capability. For a station's language, the first model in the chain that
# supports it and is installed wins. The pt-PT bake-off set the ASR order (docs/MODELS.md).
vad = ["silero-vad-v6"]
# Speech/music: drops songs before ASR (docs/MODELS.md). Optional: without it, songs are transcribed.
gate = ["yamnet"]
# Parakeet covers 25 European languages; Whisper turbo takes every other language it knows
# (Hebrew in the world stations). A station only loads the model its language resolves to.
asr = ["parakeet-tdt-0.6b-v3", "whisper-large-v3-turbo"]
# Qwen3.5 beat MADLAD on both speed and quality (docs/MEASUREMENTS.md).
translate = ["qwen3.5-9b", "madlad400-3b-ct2"]

[[model]]
id = "silero-vad-v6"
capability = "vad"
backend = "silero-onnx"
source = "url:https://raw.githubusercontent.com/snakers4/silero-vad/v6.2.3/src/silero_vad/data/silero_vad.onnx"
sha256 = "1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3"
upstream = "https://github.com/snakers4/silero-vad"
license = "MIT"
license_url = "https://github.com/snakers4/silero-vad/blob/v6.2.3/LICENSE"
tier = "default"
gated = false
languages = ["*"]
attribution = "Silero VAD v6.2.3 by Silero Team (MIT)."
size_gb = 0.0023
tested = "Every run so far, on talk radio in several languages"

[[model]]
id = "yamnet"
capability = "gate"
backend = "yamnet-litert"
# Google's own LiteRT build, published with MediaPipe's audio classifier; labels are embedded.
source = "url:https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite"
sha256 = "4d8b4a53282dc83ef04e3e7dbc4fbc98082e34e44ed798e16c3a0cdd4c584faf"
upstream = "https://github.com/tensorflow/models/tree/master/research/audioset/yamnet"
license = "Apache-2.0"
license_url = "https://github.com/tensorflow/models/blob/master/LICENSE"
tier = "default"
gated = false
languages = ["*"]
attribution = "YAMNet by Google (Apache-2.0); AudioSet class names from the AudioSet ontology (CC-BY-SA-4.0)."
size_gb = 0.004
tested = "3 min of audio in 0.16 s of one CPU core; separated songs from talk on pt-PT radio"

[[model]]
id = "parakeet-tdt-0.6b-v3"
size_gb = 2.34
tested = "Bake-off, pt-PT: 63× real time; answers in English on ~3% of utterances"
capability = "asr"
backend = "parakeet-mlx"
source = "hf:mlx-community/parakeet-tdt-0.6b-v3"
revision = "ed2b7e8c15f9aaa0b5772e2efb986255eaef7e15"
files = ["config.json", "model.safetensors"]
upstream = "https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3"
license = "CC-BY-4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
tier = "default"
gated = false
languages = ["bg", "cs", "da", "de", "el", "en", "es", "et", "fi", "fr", "hr", "hu", "it", "lt", "lv", "mt", "nl", "pl", "pt", "ro", "ru", "sk", "sl", "sv", "uk"]
attribution = "Parakeet-TDT-0.6B-v3 by NVIDIA (CC-BY-4.0); MLX conversion by mlx-community."
notes = "Detects the language itself among the languages it supports; trained on European Portuguese."

[[model]]
id = "madlad400-3b-ct2"
size_gb = 2.75
tested = "pt-PT→en: 2.9 s per utterance on CPU; invents content into Ukrainian"
capability = "translate"
backend = "ctranslate2-madlad"
source = "hf:Nextcloud-AI/madlad400-3b-mt-ct2-int8"
revision = "aa32bbdeba7880eff2096ec044cb155a340a9400"
files = ["config.json", "model.bin", "shared_vocabulary.json", "spiece.model"]
upstream = "https://huggingface.co/google/madlad400-3b-mt"
license = "Apache-2.0"
license_url = "https://www.apache.org/licenses/LICENSE-2.0"
tier = "default"
gated = false
languages = ["*"]
attribution = "MADLAD-400 3B MT by Google (Apache-2.0); CTranslate2 int8 conversion by Nextcloud."
notes = "419 languages; target chosen with a <2xx> prefix token."
# Measured: pt-PT -> uk produced fluent invented content (docs/MEASUREMENTS.md).
unsafe_targets = ["uk"]

