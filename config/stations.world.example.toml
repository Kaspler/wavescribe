# World stations over the internet: public-broadcaster news and talk in several languages, for
# when local radio isn't enough and the only link is a slow one (satellite, mobile, shared Wi-Fi).
# Use it as is or copy what you need into config/stations.toml:
#
#   uv run wavescribe serve --config config/stations.world.example.toml
#   uv run wavescribe listen bbc-ws dlf --config config/stations.world.example.toml
#
# Every station sets its own `language`, so one file holds them all. English stations translate
# to nothing: a target in the station's own language is skipped, and if no running station needs
# a translation the translator isn't even loaded.
#
# Bandwidth. The bitrate in each comment is the audio rate measured from the stream; HLS adds
# ~10% for its container. Low-bitrate variants (HE-AAC at 32-64 kbps) were picked wherever the
# broadcaster offers one; HE-AAC at 48 kbps is still fine for speech recognition. All 18 at once
# need ~1.7 Mbit/s. A ~500 kbit/s link (a satellite dish on a low-data plan, for example) carries
# about 6-8 of the light ones (<= 64 kbps), or 2-3 of the 128+ kbps ones, with room to spare.
# HLS stations point at one variant playlist, not the master: with a master playlist ffmpeg
# opens every variant when it connects.
#
# ASR. Parakeet-TDT-0.6B-v3 (first in the default chain) covers every language here except
# Hebrew, which falls through to Whisper large-v3-turbo, the chain's second model. Fetch it once:
#   uv run wavescribe models fetch whisper-large-v3-turbo
# Without it, kan-bet plays without text until the model is there, and the other stations run
# as usual.
#
# Stream URLs are the broadcasters' own endpoints (or their official CDN), each verified on
# 2026-11-21 by pulling 10 s with ffmpeg and transcribing a minute of each. Broadcasters move and
# geo-restrict streams without notice: re-check with ffprobe if one fails. Each stream comes with
# its broadcaster's terms of use, which can limit where and how it may be played: check them.

[defaults]
translate_to = ["en"]          # continuous; skipped for stations already in English
alert_languages = ["en"]
priority = 3

# -- English -------------------------------------------------------------------------------------

[[station]]
id = "bbc-ws"
name = "BBC World Service"
language = "en-GB"
priority = 1                   # HE-AAC 48 kbps
stream_hls = "https://as-hls-ww-live.akamaized.net/pool_87948813/live/ww/bbc_world_service/bbc_world_service.isml/bbc_world_service-audio%3d48000.norewind.m3u8"

[[station]]
id = "bbc-r4"
name = "BBC Radio 4"
language = "en-GB"
priority = 2                   # HE-AAC 48 kbps (international feed)
stream_hls = "https://as-hls-ww-live.akamaized.net/pool_55057080/live/ww/bbc_radio_fourfm/bbc_radio_fourfm.isml/bbc_radio_fourfm-audio%3d48000.norewind.m3u8"

[[station]]
id = "rte1"
name = "RTÉ Radio 1"
language = "en-IE"
priority = 3                   # AAC-LC 128 kbps: the lowest RTÉ offers
stream_hls = "https://liveaudio.rte.ie/hls-radio/radio1/chunklist.m3u8"

[[station]]
id = "rnz"
name = "RNZ National"
language = "en-NZ"
priority = 3                   # HE-AAC 64 kbps
stream = "https://stream-ice.radionz.co.nz/national_aac64"

[[station]]
id = "abc-news"
name = "ABC NewsRadio (Australia)"
language = "en-AU"
priority = 2                   # HE-AACv2 ~32 kbps audio (playlist says 82 kbps with overhead)
# Variant of https://streaming.abc-cdn.net.au/audio/hls/newsradio.m3u8; use that if this one moves.
stream_hls = "https://mediaserviceslive.akamaized.net/hls/live/2109425/newsradio/v0-222.m3u8"

[[station]]
id = "cbc1"
name = "CBC Radio One (Montréal)"
language = "en-CA"
priority = 3                   # AAC-LC 48 kbps
stream_hls = "https://cbcradiolive.akamaized.net/hls/live/2041030/ES_R1EMT/adaptive_48/chunklist_ao.m3u8"

[[station]]
id = "npr"
name = "NPR 24-hour program stream"
language = "en-US"
