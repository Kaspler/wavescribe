# Example alert rules. Rules run on SOURCE-LANGUAGE text, so they never depend on translation.
# Alerts can be missed or wrong: never the only warning where life, health or property is at stake.
# Keyword rules reference topics from config/keywords/<lang>.toml, picked by each station's language.
# One word list is shipped, as an example, for one language (pt.example.toml): the topic rules
# below match stations in that language only. For any other language, add its list
# (config/keywords/<lang>.toml), give a rule its own `terms`, or describe what to listen for in
# plain language (kind = "llm"); docs/GETTING_STARTED.md, section 7, says how.
# Copy to config/alerts.toml (gitignored) and adapt. A key this file doesn't take (a misspelt
# one, say) is refused by name when Wavescribe starts; `uv run wavescribe alerts check` says it too.
#
# Severity: low (stored and highlighted only), medium, high, critical. What each level does is
# set in [actions]. `near` raises the severity one level when a place from that group is named in
# the same utterance. Text heard as another language than the station's never goes above low.

[delivery]
notify_language = "en"         # notifications use this translation when it arrives in time
notify_sound = "Glass"         # the sound a notification plays, from /System/Library/Sounds
                               # (Basso, Funk, Ping, Submarine...); "" for silent notifications
translation_wait_s = 10       # wait this long for translations before delivering without them
cooldown_minutes = 15          # repeats of a rule within this window add to one alert; this
                               # long without a mention ends it, and the next one is new
remind_minutes = 60            # still mentioned this long after it was announced: one
                               # reminder, notified but never spoken (0: never)

# Spoken alerts: a voice and a fixed phrase per language. The phrase is spoken when no checked
# translation is available, so the voice always has something to say. Voices come from macOS
# (System Settings → Accessibility → Spoken Content → System voice → Manage voices). A voice
# that isn't installed speaks nothing: `uv run wavescribe alerts test` says which are missing.
# intro is spoken before what was said: its checked translation, or the words as said when
# they are in the voice's language already. summary and earlier open a digest read aloud
# ([digest] below), so that it never sounds like an alert; English has its own by default,
# other languages give theirs as the [speak.es] example shows.
[speak.en]
voice = "Daniel"
intro = "Attention. The radio reports:"
fallback = "Attention. An important announcement on the radio. Please check the screen."

# Another language, as an example: add "speak:es" to the actions below to use it.
# [speak.es]
# voice = "Mónica"
# intro = "Atención. La radio informa:"
# fallback = "Atención. Un aviso importante en la radio. Mire la pantalla."
# summary = "Resumen de Wavescribe de {stations}, de {start} a {end}. Escrito por el modelo local a partir de {read} de {said} líneas; puede omitir cosas o equivocarse."
# earlier = "Alertas anteriores, {count} en total: {alerts}."

# min_mentions: below this many mentions within the cooldown the alert stays low (stored, not
# announced), unless a local place from `near` is named. A real event is repeated on every
# bulletin; a passing reference ("o apagão" in a political debate) is said once.
# Tune on what you actually hear: `uv run wavescribe alerts replay --alerts <draft.toml>` runs everything
# stored through a draft and shows what it would have announced.

[[rule]]
id = "civil-protection"
topics = ["civil_protection"]
near = ["local"]
severity = "critical"
min_mentions = 2

[[rule]]
id = "civil-protection-mention"
topics = ["civil_protection_weak"]
near = ["local"]
severity = "low"

[[rule]]
id = "water"
topics = ["water"]
near = ["local"]
severity = "high"
min_mentions = 2

[[rule]]
id = "water-mention"
topics = ["water_weak"]
near = ["local"]
severity = "low"

[[rule]]
id = "power"
topics = ["power"]
near = ["local"]
severity = "high"
min_mentions = 3

# Fires, storms and floods are in every national bulletin: announced when they are local.
[[rule]]
id = "hazards"
topics = ["hazards"]
near = ["local"]
severity = "low"

[[rule]]
id = "weather-warning"
topics = ["hazards_weak"]
near = ["local"]
severity = "low"

[[rule]]
id = "comms"
topics = ["comms"]
near = ["local"]
severity = "medium"
min_mentions = 2

[[rule]]
id = "infrastructure-attack"
topics = ["infrastructure_attack"]
severity = "medium"
min_mentions = 2

# "guerra" is in every international bulletin (and in songs): keep it quiet unless it's local.
[[rule]]
id = "conflict-mention"
topics = ["conflict_weak"]
near = ["local"]
severity = "low"

# A rule's own words, per language (the station's language, its first part: "es" for es-MX),
# beside or instead of topics from a pack. They match as pack terms do: case and accents ignored,
# plurals found, a phrase word by word, "=" for only as written. A station whose language has no
# terms here and no pack isn't matched by this rule.
# [[rule]]
# id = "water-cut"
# terms = { es = ["corte de agua", "sin agua"], de = ["Wasser abgestellt"] }
# severity = "medium"
# verify = true     # under serve, the local model confirms each match in context before it
#                   # is announced, and drops one that isn't real
# unverified = "lower"  # with verify: a match the model couldn't check (none loaded, too busy,
#                       # no answer in 90 s) is raised marked "not checked": "lower" (the
#                       # default) one severity lower, "announce" at the rule's own, "hold"
#                       # when the check answers, or after 10 minutes as "lower" would

# A rule in plain language, for stations in any language: under serve, the local model reads
# what each station said against it about every 45 s. It needs the translation LLM, and it
# decides alone, so it can miss what you meant or match what you didn't.
# [[rule]]
# id = "told-to-leave"
# kind = "llm"
# prompt = "residents are told to leave their homes or to stay indoors"
# severity = "high"

# Regular expressions, beside or instead of topics and terms: matched on the original text,
# ignoring case, in any language (no accents folded, no plurals). Write them in 'single quotes'
# so backslashes stay as they are. \b is the edge of a word; scripts written without spaces
# (Chinese, Japanese, Thai) have none, so leave it out for them. Refused at load: invalid
# patterns, over 200 characters, and repeats inside repeats such as (a+)+.
# Here: a motorway named by its number, then closed, a few words later in the same sentence
# ("A1 cortada"). [^.]{0,30}? looks at most 30 characters ahead and stops at a full stop.
[[rule]]
id = "motorway-closed"
regex = ['\bA ?\d{1,2}\b[^.]{0,30}?\b(?:cortada|fechada|encerrada)\b']
severity = "low"

# A station gone silent: no audio (its stream or receiver is down or reconnecting), or only dead
# air (every audio level read below level_db, in dBFS), for after_minutes. Once its audio is back
# the alert says so, once (notification, log and webhooks, never spoken). Listen-only and
# switched-off stations never alert, and a station that goes silent while the alert is open
# joins it: a network outage that silences every stream is one alert. The text is Wavescribe's
# own, in English, translated like a quote for notify_language and the voices.
[[rule]]
id = "station-silent"
kind = "silence"
after_minutes = 5
level_db = -50
severity = "medium"
# stations = ["station-id"]   # only these stations; all of them when left out

# An FM station starting a traffic announcement, from its RDS (receiver stations only). Opt-in:
# uncomment it. Only the start alerts; more within cooldown_minutes join the same alert. It
# works on listen-only stations too: RDS needs no model.
# [[rule]]
# id = "traffic"
# kind = "traffic"
# severity = "medium"
# stations = ["station-id"]   # only these stations; every FM station when left out

[actions]
# Nothing is spoken aloud until you add it: a Mac that talks can wake the house, so choose the
# levels and the language. speak:<lang> speaks a checked translation into <lang> (or that
# language's fallback phrase) in its [speak.<lang>] voice above: for example "notify",
# "speak:en", "log" for critical.
critical = ["notify", "log"]
high = ["notify", "log"]
medium = ["notify", "log"]
low = ["log"]

# A digest of what was said since the last one, at whole periods of the clock: a few points the
# local model picked out, each with the lines it rests on. It can miss things or get them wrong,
# and it is no warning. It is always shown as a quiet notification, whatever became of it
# (nothing stood out, nothing was said, or why none could be made); speak = true also reads its
# points aloud in the [speak.<language>] voice, and an alert stops it at once (one being spoken
# is waited for). It covers only radio that may leave this machine.
# [digest]
# every_minutes = 60            # 30 is on the hour and half past; any number from 5 to 1440
#                               # that divides a day evenly (10, 15, 45, 90, 120, 180...)
# stations = ["station-id"]     # leave out for every station
# language = "en"               # default: notify_language
# speak = true
# quiet_hours = ["22:00", "07:00"]
